

version: 2

models:
  # ====================== HUBS ======================

  - name: hub_omni_transaction_hist
    columns:
      - name: omni_transaction_hist_hashkey
        data_type: string
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
      - name: business_key
        data_type: string
      - name: source_event_date
        data_type: date
      - name: record_source
        data_type: string
      - name: load_timestamp
        data_type: timestamp

