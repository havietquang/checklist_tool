version: 2

models:
  - name: ref_ocbchannel_authen_type
    columns:
      - name: ref_hashkey
        data_type: string
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
      - name: ref_type
        data_type: string
      - name: ref_code
        data_type: string
      - name: ref_description
        data_type: string
      - name: authen_code_map
        data_type: string
      - name: hashdiff_full
        data_type: string
      - name: source_event_date
        data_type: date
      - name: record_source
        data_type: string
      - name: load_timestamp
        data_type: timestamp

  - name: ref_ocbchannel_eb_package_type
    columns:
      - name: ref_hashkey
        data_type: string
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
      - name: ref_type
        data_type: string
      - name: ref_code
        data_type: string
      - name: ref_description
        data_type: string
      - name: package_type_id
        data_type: string
      - name: channel
        data_type: string
      - name: package_name
        data_type: string
      - name: package_status
        data_type: bigint
      - name: notes
        data_type: string
      - name: package_desc
        data_type: string
      - name: newomni_authen_code
        data_type: string
      - name: hashdiff_full
        data_type: string
      - name: source_event_date
        data_type: date
      - name: record_source
        data_type: string
      - name: load_timestamp
        data_type: timestamp
