  - name: hub_ldm_partner
    config:
      contract:
        enforced: true
    columns:
      - name: ldm_partner_hashkey
        data_type: string
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
