version: 2

models:
  - name: v_stg_esb_omni_transaction_hist
    columns:
      - name: hashkey
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
  - name: v_stg_esb_transactions
