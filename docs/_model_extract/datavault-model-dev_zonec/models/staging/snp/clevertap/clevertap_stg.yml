version: 2

models:
  - name: v_stg_clevertap_campaigns
    columns:
      - name: hashkey
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"

  - name: v_stg_clevertap_events
    columns:
      - name: hashkey
        tests:
          - unique:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
          - not_null:
              config:
                where: "source_event_date = to_date('{{ var(\"target_date\") }}', 'yyyyMMdd')"
