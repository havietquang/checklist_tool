resources:
  jobs:
    dbrjobs_run_script_clevertap_crm_callcenter_appsflyer:
      name: dbrjobs-run-script-clevertap-crm-callcenter-appsflyer
      email_notifications:
        on_failure:
          - anhptv6@ocb.com.vn
      max_concurrent_runs: 1

      parameters:
        - name: start_date
          default: "20250101"
        - name: end_date
          default: "20250110"
        - name: environment
          default: "${var.env}"
        - name: catalog_sourcing
          default: "ocb_datavault_${var.env}_sourcing"
        - name: catalog_cleaned
          default: "ocb_datavault_${var.env}_cleaned"

      tasks:

        - task_key: callcenter__callcenter
          run_if: ALL_SUCCESS
          sql_task:
            file: {path: ../analyses/phase2/callcenter/callcenter.sql, source: WORKSPACE}
            warehouse_id: "${var.sql_warehouse_id}"
            parameters: {start_date: "{{job.parameters.start_date}}", end_date: "{{job.parameters.end_date}}", catalog_sourcing: "{{job.parameters.catalog_sourcing}}", catalog_cleaned: "{{job.parameters.catalog_cleaned}}"}

